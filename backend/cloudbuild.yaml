# Construction et déploiement du backend VALEO sur Cloud Run.
#
#   gcloud builds submit --config backend/cloudbuild.yaml
#
# Pendant la mise au point, tant qu'aucun pisteur n'utilise le service, on
# n'allume pas d'instance en permanence :
#
#   gcloud builds submit --config backend/cloudbuild.yaml \
#     --substitutions=_MIN_INSTANCES=0
#
# Le jour de la mise en service, redéployer SANS cette substitution pour
# revenir au défaut (voir _MIN_INSTANCES plus bas).
#
# Les SECRETS ne sont pas ici : ni ADMIN_PASSWORD, ni JWT_SECRET, ni compte de
# service. Ils vivent dans Secret Manager et sont attachés au service (voir
# docs/MIGRATION-FIREBASE.md). Un secret dans un fichier de build finit dans les
# journaux de construction, qui sont conservés.
substitutions:
  _REGION: europe-west1
  _SERVICE: valeo-backend
  # Instances gardées chaudes. Le défaut est 1, délibérément : à zéro, la
  # première synchronisation après une accalmie paie un démarrage à froid,
  # devant un pisteur qui attend en bout de piste. Le mettre à 0 le temps de
  # la mise au point, quand personne n'utilise encore le service.
  _MIN_INSTANCES: '1'

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/valeo/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/valeo/${_SERVICE}:latest
      - -f
      - backend/Dockerfile
      - backend

  - name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/valeo/${_SERVICE}"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/valeo/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      # L'application mobile n'a pas de jeton Google : l'accès HTTP doit être
      # public. C'est le JWT de VALEO qui autorise, pas IAM.
      - --allow-unauthenticated
      - --set-env-vars=DATA_BACKEND=firestore
      # Secret Manager, jamais des variables en clair.
      - --set-secrets=ADMIN_PASSWORD=valeo-admin-password:latest,JWT_SECRET=valeo-jwt-secret:latest
      # Cf. _MIN_INSTANCES plus haut : une instance chaude par défaut, zéro
      # pendant la mise au point.
      - --min-instances=${_MIN_INSTANCES}
      - --cpu=1
      - --memory=512Mi
      - --timeout=60s

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/valeo/${_SERVICE}
options:
  logging: CLOUD_LOGGING_ONLY
