<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back-office — maquette</title>
<link rel="icon" href="../assets/favicon.png">
<!--
  Maquette du back-office (docs/backoffice.md, étape 1). Fichier autonome : il ne fait pas
  partie de l'application ni du portail, et n'en modifie aucun code.
  - Marque : copie de src/config/brand.ts (objet BRAND ci-dessous). Dans le portail réel,
    nom, couleurs et e-mail de support seront LUS dans brand.ts, jamais écrits en dur.
    Le vert de marque #14B8A6 n'est utilisé que sur fond sombre (barre latérale, connexion).
  - Jetons : copie du design system v2 (branche design-v2, docs/design-system.md §1).
  - Polices : Google Fonts (maquette) ; le portail les auto-hébergera.
  - Icônes : Ionicons, même jeu que @expo/vector-icons dans l'app.
  - Le panneau « Outils de la maquette » (en bas à droite) sert uniquement à tester la
    maquette : il n'existera pas dans le portail.
  - Toutes les personnes, adresses et montants sont FICTIFS.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<style>
  /* ───────── Jetons du design system v2 (miroir de docs/design-system.md §1, branche design-v2) ───────── */
  .t-light {
    --background:#F5F7F6; --surface:#FFFFFF; --surfaceAlt:#ECF0EE; --border:#DDE3E0; --borderStrong:#7D8984;
    --text:#121A17; --textMuted:#3F4A45; --textSubtle:#56625C;
    --primary:#00685F; --primaryPressed:#004F48; --onPrimary:#FFFFFF; --primaryContainer:#D3EFEA; --onPrimaryContainer:#00413B;
    --accent:#8A5300; --accentContainer:#FFD9A8; --onAccentContainer:#2B1700;
    --income:#1E6B3A; --expense:#B3261E;
    --success:#1E6B3A; --successBg:#D7F0DF; --onSuccess:#FFFFFF;
    --warning:#8A5300; --warningBg:#FFEBCF;
    --danger:#B3261E; --dangerBg:#FDE2DE; --onDanger:#FFFFFF;
    --info:#3949AB; --infoBg:#E3E6FA;
    --heroFrom:#0B6B61; --heroTo:#06504A; --onHero:#FFFFFF; --onHeroMuted:rgba(255,255,255,.88); --heroTrack:rgba(255,255,255,.28);
    --track:#DDE3E0; --disabledBg:#E3E7E5; --onDisabled:#5E6A64;
    --inverseSurface:#1F2724; --onInverse:#F2F6F4;
    --overlay:rgba(18,26,23,.5);
    --shadow1:0 1px 2px rgba(18,26,23,.04), 0 2px 8px rgba(18,26,23,.06);
    --shadow2:0 6px 16px rgba(18,26,23,.12), 0 1px 3px rgba(18,26,23,.08);
    --chartArea:rgba(0,104,95,.10);
    color-scheme: light;
  }
  .t-dark {
    --background:#0E1412; --surface:#161D1A; --surfaceAlt:#212A26; --border:#2C3632; --borderStrong:#75827C;
    --text:#EEF3F0; --textMuted:#BAC5BF; --textSubtle:#9AA6A0;
    --primary:#4FD1C0; --primaryPressed:#7FE0D3; --onPrimary:#00201C; --primaryContainer:#0F3D37; --onPrimaryContainer:#B6F1E8;
    --accent:#FFC266; --accentContainer:#4A3000; --onAccentContainer:#FFDDB0;
    --income:#5BD6A0; --expense:#FF8A80;
    --success:#5BD6A0; --successBg:#123826; --onSuccess:#00210F;
    --warning:#FFC266; --warningBg:#3A2A0E;
    --danger:#FF8A80; --dangerBg:#3D1714; --onDanger:#3B0906;
    --info:#A5B4FF; --infoBg:#1E2547;
    --heroFrom:#0D5C53; --heroTo:#08413B; --onHero:#FFFFFF; --onHeroMuted:rgba(255,255,255,.86); --heroTrack:rgba(255,255,255,.24);
    --track:#2C3632; --disabledBg:#28322E; --onDisabled:#97A39D;
    --inverseSurface:#E3EAE6; --onInverse:#17201C;
    --overlay:rgba(0,0,0,.7);
    --shadow1:none; --shadow2:0 0 0 1px var(--border);
    --chartArea:rgba(79,209,192,.12);
    color-scheme: dark;
  }
  /* Couleurs de marque (injectées depuis BRAND = brand.ts) : fond nuit de la barre latérale et de la connexion.
     Le vert de marque n'apparaît QUE sur ce fond sombre (contraste ≈ 7,9:1). */
  :root { --brandNight:#020617; --brandGreen:#14B8A6; --brandGold:#FBBF24; --onNight:#E6EEF0; --onNightMuted:#A7B4BC; --nightLine:rgba(255,255,255,.08); --nightHover:rgba(255,255,255,.06); }

  /* ───────── Base ───────── */
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:Inter, system-ui, sans-serif; background:#E4E9E7; color:#121A17; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea { font:inherit; color:inherit; }
  [hidden] { display:none !important; }
  .sr { position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .tnum { font-variant-numeric:tabular-nums; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; animation:none !important; } }

  .stage { padding:24px 16px 120px; display:grid; gap:28px; justify-items:center; }
  .stage-label { font:600 13px Inter; color:#3F4A45; justify-self:start; }

  /* ───────── Cadre du portail (requêtes de conteneur : la mise en page suit la largeur du cadre) ───────── */
  .frame { width:100%; max-width:1440px; height:900px; border-radius:16px; overflow:hidden; position:relative; container-type:inline-size; container-name:portal; box-shadow:0 10px 40px rgba(18,26,23,.18); background:var(--background); color:var(--text); }
  .frame.vp-tablet { max-width:820px; height:1000px; }
  .frame.vp-phone { max-width:390px; height:820px; border-radius:28px; }
  .app { display:grid; grid-template-columns:272px 1fr; grid-template-rows:minmax(0,1fr); height:100%; position:relative; }
  .main { min-width:0; height:100%; overflow:auto; }
  .content { padding:32px 32px 56px; }
  .content-inner { max-width:1240px; margin:0 auto; display:grid; gap:24px; }
  .content-inner > * { min-width:0; }
  :focus-visible { outline:2px solid var(--primary); outline-offset:2px; border-radius:6px; }
  .skip { position:absolute; left:8px; top:-60px; z-index:30; background:var(--primary); color:var(--onPrimary); padding:10px 14px; border-radius:10px; font-weight:600; text-decoration:none; }
  .skip:focus { top:8px; }

  /* ───────── Barre latérale (fond nuit de la marque, dans les deux thèmes) ───────── */
  .side { background:var(--brandNight); color:var(--onNight); display:flex; flex-direction:column; padding:20px 14px 14px; gap:4px; overflow-y:auto; min-height:0; border-right:1px solid var(--nightLine); z-index:20; }
  .side :focus-visible { outline-color:var(--brandGreen); }
  .brandrow { display:flex; align-items:center; gap:12px; padding:2px 8px 16px; }
  .brandrow img { width:40px; height:40px; border-radius:10px; flex:none; }
  .brandrow .nm { font:800 18px/1.1 'Plus Jakarta Sans',sans-serif; letter-spacing:-.2px; }
  .brandrow .sub { font:500 12px/1.3 Inter; color:var(--onNightMuted); }
  .btn.side-close { display:none; margin-left:auto; }
  .ssearch { position:relative; margin:0 2px 6px; }
  .ssearch ion-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--onNightMuted); font-size:17px; pointer-events:none; }
  .ssearch input { width:100%; height:42px; border-radius:10px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.04); color:var(--onNight); padding:0 12px 0 38px; font-size:14px; }
  .ssearch input::placeholder { color:var(--onNightMuted); }
  .ssearch input:focus { outline:none; border-color:var(--brandGreen); box-shadow:0 0 0 3px rgba(20,184,166,.25); }
  .navgroup { display:grid; gap:2px; }
  .navsec { font:600 12px Inter; color:var(--onNightMuted); padding:14px 12px 6px; letter-spacing:.1px; }
  .navlink { display:flex; align-items:center; gap:12px; min-height:44px; padding:0 12px; border-radius:10px; color:var(--onNight); text-decoration:none; font:500 15px Inter; position:relative; background:none; border:0; width:100%; text-align:left; cursor:pointer; }
  .navlink ion-icon { font-size:20px; color:var(--onNightMuted); flex:none; }
  .navlink:hover { background:var(--nightHover); }
  .navlink[aria-current="page"] { background:rgba(20,184,166,.16); font-weight:600; }
  .navlink[aria-current="page"] ion-icon { color:var(--brandGreen); }
  .navlink[aria-current="page"]::before { content:""; position:absolute; left:-14px; top:10px; bottom:10px; width:3px; border-radius:0 3px 3px 0; background:var(--brandGreen); }
  .navlink .lbl { flex:1; }
  .navlink.danger:hover { background:rgba(255,138,128,.10); }
  .side-bottom { margin-top:auto; padding-top:12px; border-top:1px solid var(--nightLine); display:grid; gap:2px; }
  .profile-mini { display:flex; gap:12px; align-items:center; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.04); margin-bottom:6px; }
  .profile-mini .avatar { background:rgba(20,184,166,.18); color:#B6F1E8; }
  .profile-mini .who { font:600 14px/1.25 Inter; } .profile-mini .rl { font:500 12px/1.3 Inter; color:var(--onNightMuted); display:flex; gap:5px; align-items:center; }
  .profile-mini .rl ion-icon { color:var(--brandGreen); font-size:13px; }
  .settings { margin:4px 2px 6px; padding:12px; border-radius:12px; background:rgba(255,255,255,.04); display:grid; gap:10px; min-width:0; }
  .settings .btn { white-space:normal; text-align:left; min-height:40px; }
  .settings .t { font:600 12px Inter; color:var(--onNightMuted); }
  .themeseg { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; background:rgba(255,255,255,.05); border-radius:10px; padding:3px; }
  .themeseg button { border:0; background:transparent; color:var(--onNight); min-height:40px; border-radius:8px; font:600 13px Inter; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .themeseg button ion-icon { font-size:16px; color:var(--onNightMuted); }
  .themeseg button[aria-checked="true"] { background:rgba(20,184,166,.22); }
  .themeseg button[aria-checked="true"] ion-icon { color:var(--brandGreen); }
  .settings .session { font:500 12px/1.4 Inter; color:var(--onNightMuted); display:flex; gap:6px; align-items:flex-start; }
  .settings .session ion-icon { color:var(--brandGreen); font-size:15px; flex:none; margin-top:1px; }
  .chev-rot { margin-left:auto; transition:transform .15s; font-size:16px !important; }
  .navlink[aria-expanded="true"] .chev-rot { transform:rotate(180deg); }
  .nav-scrim { display:none; }

  /* ───────── Avatar, typo ───────── */
  .avatar { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; font:700 13px Inter; background:var(--primaryContainer); color:var(--onPrimaryContainer); flex:none; }
  .avatar.lg { width:64px; height:64px; font-size:22px; }
  .pagetitle { display:flex; align-items:center; gap:12px; min-height:44px; }
  .pagetitle h1 { font:700 28px/1.2 'Plus Jakarta Sans',sans-serif; margin:0; letter-spacing:-.4px; }
  .btn.menu-btn { display:none; }
  .h-sec { font:700 17px/1.4 'Plus Jakarta Sans',sans-serif; margin:0; }
  .muted { color:var(--textMuted); } .subtle { color:var(--textSubtle); }
  .small { font-size:14px; line-height:1.43; } .caption { font:500 13px/1.38 Inter; }
  .rowbetween { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }

  /* ───────── Boutons (DS v2 §8.1) ───────── */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:12px; border:0; font:600 15px Inter; cursor:pointer; text-decoration:none; white-space:nowrap; transition:background-color .15s; }
  .btn ion-icon { font-size:20px; }
  .btn.primary { background:var(--primary); color:var(--onPrimary); } .btn.primary:hover { background:var(--primaryPressed); }
  .btn.secondary { background:var(--primaryContainer); color:var(--onPrimaryContainer); }
  .btn.outline { background:var(--surface); color:var(--text); border:1.5px solid var(--borderStrong); }
  .btn.outline:hover { background:var(--surfaceAlt); }
  .btn.tertiary { background:transparent; color:var(--primary); padding:0 10px; }
  .btn.tertiary:hover { background:var(--surfaceAlt); }
  .btn.destructive { background:var(--dangerBg); color:var(--danger); }
  .btn.danger { background:var(--danger); color:var(--onDanger); }
  .btn.sm { min-height:36px; padding:0 12px; font-size:14px; border-radius:10px; }
  .btn.icon-only { width:44px; padding:0; }
  .btn[disabled] { background:var(--disabledBg); color:var(--onDisabled); cursor:not-allowed; border-color:transparent; }

  /* ───────── Cartes, KPI, graphiques ───────── */
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow1); }
  .card-pad { padding:20px; }
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px 0; flex-wrap:wrap; }
  .kpis { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; }
  .kpi { padding:20px; display:grid; gap:10px; align-content:start; }
  .kpi .lbl { display:flex; gap:10px; align-items:center; font:600 14px Inter; color:var(--textMuted); }
  .kpi .ico { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; background:var(--primaryContainer); color:var(--primary); font-size:19px; flex:none; }
  .kpi .val { font:800 32px/1.1 'Plus Jakarta Sans',sans-serif; letter-spacing:-.6px; font-variant-numeric:tabular-nums; }
  .kpi .meta { font:500 13px Inter; color:var(--textSubtle); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .kpi.hero { background:linear-gradient(135deg, var(--heroFrom), var(--heroTo)); color:var(--onHero); border:0; }
  .kpi.hero .lbl, .kpi.hero .meta { color:var(--onHeroMuted); }
  .kpi.hero .ico { background:var(--heroTrack); color:var(--onHero); }
  .delta { display:inline-flex; gap:3px; align-items:center; font:600 13px Inter; padding:2px 8px; border-radius:8px; background:var(--successBg); color:var(--success); }
  .kpi.hero .delta { background:var(--heroTrack); color:var(--onHero); }
  .planbar { display:flex; height:10px; border-radius:6px; overflow:hidden; gap:2px; background:var(--surface); }
  .planbar span { display:block; height:100%; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font:500 13px Inter; color:var(--textMuted); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .charts { display:grid; grid-template-columns:2fr 1fr; gap:16px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .chart { position:relative; padding:8px 20px 16px; }
  .chart svg { width:100%; height:240px; display:block; overflow:visible; }
  .chart .tip { position:absolute; pointer-events:none; background:var(--inverseSurface); color:var(--onInverse); font:500 13px/1.35 Inter; padding:8px 10px; border-radius:10px; box-shadow:var(--shadow2); opacity:0; transform:translate(-50%, -110%); white-space:nowrap; transition:opacity .12s; }
  .chart .tip b { font-weight:700; font-variant-numeric:tabular-nums; }
  .axis text { fill:var(--textSubtle); font:500 12px Inter; }
  .grid line { stroke:var(--border); }
  .seg { display:inline-flex; background:var(--surfaceAlt); border-radius:10px; padding:3px; gap:2px; }
  .seg button { border:0; background:transparent; min-height:32px; padding:0 12px; border-radius:8px; font:600 13px Inter; color:var(--textMuted); cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--surface); color:var(--text); box-shadow:var(--shadow1); }
  .hbars { display:grid; gap:14px; padding:12px 20px 20px; }
  .hbar .row { display:flex; justify-content:space-between; font:500 14px Inter; margin-bottom:6px; gap:8px; }
  .hbar .row b { font-variant-numeric:tabular-nums; font-weight:700; }
  .hbar .trk { height:10px; background:var(--track); border-radius:6px; overflow:hidden; }
  .hbar .fill { height:100%; background:var(--primary); border-radius:6px; }
  .quick { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; }
  .qa { display:flex; gap:12px; align-items:center; padding:16px; border-radius:14px; background:var(--surface); border:1px solid var(--border); text-decoration:none; color:var(--text); font:600 15px Inter; cursor:pointer; text-align:left; }
  .qa:hover { background:var(--surfaceAlt); }
  .qa ion-icon { font-size:22px; color:var(--primary); flex:none; }
  .qa .chev { margin-left:auto; color:var(--textSubtle); font-size:18px; }

  /* ───────── Badges : TOUJOURS icône + mot ───────── */
  .badge { display:inline-flex; align-items:center; gap:5px; font:600 13px/1 Inter; padding:5px 9px; border-radius:8px; white-space:nowrap; }
  .badge ion-icon { font-size:15px; }
  .b-neutral { background:var(--surfaceAlt); color:var(--textMuted); }
  .b-success { background:var(--successBg); color:var(--success); }
  .b-warning { background:var(--warningBg); color:var(--warning); }
  .b-danger { background:var(--dangerBg); color:var(--danger); }
  .b-info { background:var(--infoBg); color:var(--info); }
  .b-accent { background:var(--accentContainer); color:var(--onAccentContainer); }
  .b-primary { background:var(--primaryContainer); color:var(--onPrimaryContainer); }

  /* ───────── Champs, barre d'outils, tableaux ───────── */
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; padding:16px 20px; border-bottom:1px solid var(--border); }
  .toolbar .grow { flex:1; }
  .field { display:grid; gap:6px; }
  .field > label, .flabel { font:600 14px Inter; color:var(--text); }
  .field .help { font:500 13px Inter; color:var(--textSubtle); }
  .input, .select, textarea.input { height:44px; border-radius:12px; border:1.5px solid var(--borderStrong); background:var(--surface); padding:0 12px; font-size:15px; min-width:0; }
  textarea.input { height:auto; min-height:84px; padding:10px 12px; resize:vertical; }
  .select { padding-right:36px; appearance:none; background-image:linear-gradient(45deg, transparent 50%, var(--textMuted) 50%), linear-gradient(135deg, var(--textMuted) 50%, transparent 50%); background-position:calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size:5px 5px; background-repeat:no-repeat; }
  .input:focus, .select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primaryContainer); }
  .search-field { position:relative; flex:1 1 280px; }
  .search-field ion-icon { position:absolute; left:12px; bottom:13px; color:var(--textSubtle); font-size:18px; }
  .search-field .input { width:100%; padding-left:38px; }
  .tablewrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font:600 13px Inter; color:var(--textMuted); padding:12px 16px; background:var(--surfaceAlt); white-space:nowrap; }
  th:first-child, td:first-child { padding-left:20px; }
  td { padding:12px 16px; border-top:1px solid var(--border); vertical-align:middle; }
  tbody tr:hover { background:var(--surfaceAlt); }
  tr.clickable { cursor:pointer; }
  td.tnum { white-space:nowrap; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .caption ion-icon { font-size:15px; vertical-align:-2px; }
  .ucell { display:flex; gap:12px; align-items:center; min-width:220px; }
  .ucell b { display:block; font-weight:600; font-size:15px; }
  .ucell span { color:var(--textSubtle); font-size:13px; }
  .mono { font-variant-numeric:tabular-nums; letter-spacing:.2px; color:var(--textMuted); font-size:13px; }
  .pager { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 20px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .amt-in { color:var(--income); font-weight:600; } .amt-out { color:var(--expense); font-weight:600; } .amt-tr { color:var(--text); font-weight:600; }
  .typecell { display:flex; gap:8px; align-items:center; }
  .typeico { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:16px; flex:none; }
  .ti-in { background:var(--successBg); color:var(--income); } .ti-out { background:var(--dangerBg); color:var(--expense); } .ti-tr { background:var(--infoBg); color:var(--info); }

  /* ───────── Messages ───────── */
  .msg { display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-radius:12px; border-left:4px solid; font-size:14px; line-height:1.45; }
  .msg ion-icon { font-size:20px; flex:none; margin-top:1px; }
  .msg.info { background:var(--infoBg); border-color:var(--info); } .msg.info ion-icon { color:var(--info); }
  .msg.warning { background:var(--warningBg); border-color:var(--warning); } .msg.warning ion-icon { color:var(--warning); }
  .msg.danger { background:var(--dangerBg); border-color:var(--danger); } .msg.danger ion-icon { color:var(--danger); }
  .msg.success { background:var(--successBg); border-color:var(--success); } .msg.success ion-icon { color:var(--success); }

  /* ───────── Fiche ───────── */
  .profile { display:flex; gap:20px; align-items:center; flex-wrap:wrap; padding:24px; }
  .profile .id { flex:1 1 260px; min-width:0; }
  .profile .tags { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .dl { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); margin:0; }
  .dl div { padding:14px 20px; border-top:1px solid var(--border); }
  .dl dt { font:500 13px Inter; color:var(--textSubtle); margin-bottom:4px; }
  .dl dd { margin:0; font:600 15px Inter; }

/* ───────── Graphiques (une seule série par graphique, survol + clavier) ───────── */
function lineChart(el, data, unit) {
  const W = Math.max(320, Math.round(el.clientWidth - 40) || 640), H = 240, P = { l: 52, r: 12, t: 12, b: 28 };
  const min = Math.min(...data), max = Math.max(...data);
  const lo = Math.floor((min * 0.94) / 100) * 100, hi = Math.ceil((max * 1.03) / 100) * 100;
  const x = (i) => P.l + (i * (W - P.l - P.r)) / (data.length - 1);
  const y = (v) => P.t + (1 - (v - lo) / (hi - lo)) * (H - P.t - P.b);
  const ticks = [0, 1, 2, 3].map((k) => lo + ((hi - lo) * k) / 3);
  const path = data.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area = `${path}L${x(data.length - 1)},${H - P.b}L${x(0)},${H - P.b}Z`;
  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit} sur 30 jours, de ${num(data[0])} à ${num(data[data.length - 1])}">
      <g class="grid">${ticks.map((t) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}"/>`).join('')}</g>
      <g class="axis">${ticks.map((t) => `<text x="${P.l - 8}" y="${y(t) + 4}" text-anchor="end">${num(Math.round(t))}</text>`).join('')}
        ${[0, 7, 14, 21, 29].map((i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${dayLabel(i)}</text>`).join('')}</g>
      <path d="${area}" fill="var(--chartArea)"/>
      <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line class="xh" y1="${P.t}" y2="${H - P.b}" stroke="var(--borderStrong)" stroke-dasharray="3 3" opacity="0"/>
      <circle class="dot" r="5" fill="var(--primary)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
      <rect x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent" tabindex="0" aria-label="Parcourir les valeurs avec les flèches"/>
    </svg><div class="tip" role="status" aria-live="polite"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh'), dot = el.querySelector('.dot'), hit = el.querySelector('rect');
  let cur = data.length - 1;
  const show = (i) => {
    cur = Math.max(0, Math.min(data.length - 1, i));
    const px = x(cur), py = y(data[cur]);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('opacity', 1);
    dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.setAttribute('opacity', 1);
    const r = svg.getBoundingClientRect();
    tip.style.left = `${px * (r.width / W) + 20}px`; tip.style.top = `${py * (r.height / H) + 8}px`; tip.style.opacity = 1;
    tip.innerHTML = `${dayLabel(cur)}/2026<br><b>${num(data[cur])}</b> ${unit.toLowerCase()}`;
  };
  const hide = () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); };
  hit.addEventListener('mousemove', (e) => { const r = svg.getBoundingClientRect(); const vx = ((e.clientX - r.left) / r.width) * W; show(Math.round(((vx - P.l) / (W - P.l - P.r)) * (data.length - 1))); });
  hit.addEventListener('mouseleave', hide); hit.addEventListener('blur', hide); hit.addEventListener('focus', () => show(cur));
  hit.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { show(cur - 1); e.preventDefault(); } if (e.key === 'ArrowRight') { show(cur + 1); e.preventDefault(); } });
}

function renderFrame(theme) {

  else f.innerHTML = shell(s, theme, can(SCREEN_PERM[s]) ? S[s]() : DENIED(s));
  return f;
}
function render() {
  const stage = document.getElementById('stage');

  const themes = state.theme === 'both' ? ['light', 'dark'] : [state.theme === 'auto' ? sys : state.theme];

  try { localStorage.setItem('bo-mock-v2', JSON.stringify({ ...state, settingsOpen: false })); } catch { /* stockage indisponible */ }
}

function closeDialog(frame) { const s = frame.querySelector('.scrim'); if (s) { s.remove(); lastFocus?.focus?.(); } }
function toast(frame, text) {
  frame.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `${ic('checkmark-circle')}<span>${esc(text)}</span>`;
  frame.appendChild(t); setTimeout(() => t.remove(), 4000);
}
function setNav(frame, open) {
  frame.classList.toggle('nav-open', open);
  frame.querySelector('.menu-btn')?.setAttribute('aria-expanded', String(open));
  if (open) frame.querySelector('.side .navlink, .side input')?.focus();
  else frame.querySelector('.menu-btn')?.focus();
}
function go(target) { state.screen = target === 'home' ? home() : target; state.settingsOpen = false; render(); } // re-rendu = tiroir refermé

/* Appui long (tablette) : affiche le nom de l'entrée sans l'ouvrir. */
let lpTimer = null, lpFired = false;
document.addEventListener('touchstart', (e) => {
  const a = e.target.closest('.navlink'); if (!a) return;
  lpFired = false;
  lpTimer = setTimeout(() => { lpFired = true; a.classList.add('tip-on'); setTimeout(() => a.classList.remove('tip-on'), 1600); }, 450);
}, { passive: true });
document.addEventListener('touchend', () => clearTimeout(lpTimer));

document.addEventListener('click', (e) => {
  /* Outils de la maquette */
  if (e.target.closest('.mt-toggle')) { const p = document.getElementById('mt-panel'); p.hidden = !p.hidden; e.target.closest('.mt-toggle').setAttribute('aria-expanded', String(!p.hidden)); return; }
  const mt = e.target.closest('.mt-opts button');
  if (mt) { const k = mt.parentElement.dataset.k; state[k] = mt.dataset.v; if (k === 'theme' && mt.dataset.v !== 'both') state.ui = mt.dataset.v; if (k === 'role' && !['login', 'invite'].includes(state.screen) && !can(SCREEN_PERM[state.screen])) state.screen = home(); render(); return; }
  /* Portail */
  const frame = e.target.closest('.frame'); if (!frame) return;
  if (lpFired && e.target.closest('.navlink')) { e.preventDefault(); lpFired = false; return; }
  if (e.target.closest('[data-close]') || e.target.classList.contains('scrim')) { closeDialog(frame); return; }
  const done = e.target.closest('[data-done]');
  if (done && !done.disabled) { const msg = done.dataset.done; closeDialog(frame); toast(frame, msg); e.preventDefault(); return; }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const act = e.target.closest('[data-action]');
  if (!act) return;
  e.preventDefault();
  const a = act.dataset.action;
  if (a === 'openNav') return setNav(frame, true);
  if (a === 'closeNav') return setNav(frame, false);
  if (a === 'toggleSettings' || a === 'setTheme') {
    if (a === 'toggleSettings') state.settingsOpen = !state.settingsOpen;
    else { state.ui = act.dataset.v; state.theme = act.dataset.v; }
    const wasOpen = frame.classList.contains('nav-open');
    render();
    // Le tiroir (téléphone) reste ouvert pendant qu'on règle le thème.
    if (wasOpen) document.querySelectorAll('.frame').forEach((f) => f.classList.add('nav-open'));
    return;
  }
  openDialog(frame, a, act.dataset.op ?? act.dataset.i);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.querySelectorAll('.frame').forEach((f) => { if (f.querySelector('.scrim')) closeDialog(f); else if (f.classList.contains('nav-open')) setNav(f, false); });
  if (e.key === 'Enter' && e.target.matches('tr[data-go]')) go(e.target.dataset.go);
  if (e.key === 'Enter' && e.target.matches('[data-go-on-enter]')) go(e.target.dataset.goOnEnter);
  if (e.key === 'Tab') {
    const s = e.target.closest?.('.scrim'); if (!s) return;
    const f = [...s.querySelectorAll('button:not([disabled]), input, select, textarea')].filter((n) => !n.closest('[hidden]'));
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { f[f.length - 1].focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { f[0].focus(); e.preventDefault(); }
  }
});
render();
</script>
</body>
</html>
