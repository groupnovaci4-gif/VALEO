<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion par téléphone — maquettes</title>
<!-- Direction B de la refonte validée : fond sable, vert foncé, Plus Jakarta Sans + Inter, aucun dégradé.
     ?t=light (défaut) ou ?t=dark. Chaque téléphone : 360 × 800 dp. Tous les textes sont des PROPOSITIONS (TEXTES.md). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F4F1EA; --surface:#FFFCF7; --surface2:#EDE7DC; --border:#EAE3D7; --strong:#8A8072;
    --text:#1F1C17; --text2:#564E43; --text3:#6E6558; --brand:#0F4A3A; --onbrand:#FFFFFF;
    --brandsoft:#DCEBE3; --onbrandsoft:#0B3329; --hero:#0F4A3A; --danger:#B3261E; --dangerbg:#F8E3DF;
    --warn:#8A5A00; --warnbg:#F6EBD3; --info:#2F5373; --infobg:#E3EAF0; --wa:#1E7A45; --wabg:#E1EFE4;
  }
  :root[data-t="dark"] {
    --bg:#13120F; --surface:#1D1B17; --surface2:#29261F; --border:#2C2923; --strong:#827869;
    --text:#F3EFE7; --text2:#BDB4A4; --text3:#A0968A; --brand:#4FB08F; --onbrand:#0B2A21;
    --brandsoft:#183A30; --onbrandsoft:#BFE6D6; --hero:#123A2F; --danger:#EF6B61; --dangerbg:#3D1A16;
    --warn:#D9A441; --warnbg:#3A2E16; --info:#9DB7D3; --infobg:#1E2A36; --wa:#63C08A; --wabg:#16301F;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#E9E6DF; font:400 15px/22px Inter, system-ui, sans-serif; color:var(--text); padding:24px; }
  :root[data-t="dark"] body { background:#0B0A08; }
  .board { display:flex; flex-wrap:wrap; gap:28px; }
  .wrap { display:flex; flex-direction:column; gap:8px; }
  .lab { font:600 13px Inter; color:#5B5850; max-width:360px; }
  :root[data-t="dark"] .lab { color:#A0968A; }
  .phone { width:360px; height:800px; background:var(--bg); position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .sb { height:28px; padding:6px 20px 0; display:flex; justify-content:space-between; font:600 13px Inter; color:var(--text); }
  .top { height:56px; display:flex; align-items:center; padding:0 4px; }
  .back { width:48px; height:48px; display:flex; align-items:center; justify-content:center; }
  .page { flex:1; padding:8px 20px 24px; display:flex; flex-direction:column; gap:14px; }
  h1 { font:800 26px/32px "Plus Jakarta Sans", Inter, sans-serif; letter-spacing:-.3px; }
  h2 { font:800 22px/28px "Plus Jakarta Sans", Inter, sans-serif; letter-spacing:-.2px; }
  .sub { color:var(--text2); font:400 15px/22px Inter; }
  .small { color:var(--text3); font:400 13px/18px Inter; }
  .link { color:var(--brand); font:600 15px/20px Inter; }
  .btn { height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; gap:8px; font:600 16px Inter; }
  .primary { background:var(--brand); color:var(--onbrand); }
  .secondary { background:var(--surface); color:var(--text); border:1.5px solid var(--strong); }
  .ghost { color:var(--brand); height:48px; }
  .disabled { background:var(--surface2); color:var(--text3); }
  .field { background:var(--surface); border:1.5px solid var(--strong); border-radius:14px; height:56px; display:flex; align-items:center; gap:10px; padding:0 14px; font:600 18px Inter; }
  .field.focus { border:2px solid var(--brand); }
  .field label { position:absolute; }
  .flab { font:600 14px Inter; color:var(--text2); margin-bottom:6px; }
  .cc { display:flex; align-items:center; gap:6px; padding-right:10px; border-right:1px solid var(--border); font:600 16px Inter; color:var(--text); }
  .boxes { display:flex; gap:8px; justify-content:center; }
  .box { width:46px; height:58px; border-radius:14px; background:var(--surface); border:1.5px solid var(--strong); display:flex; align-items:center; justify-content:center; font:700 24px Inter; }
  .box.cur { border:2px solid var(--brand); }
  .box.err { border:2px solid var(--danger); color:var(--danger); }
  .dots { display:flex; gap:14px; justify-content:center; margin:6px 0; }
  .dot { width:16px; height:16px; border-radius:8px; border:2px solid var(--strong); }
  .dot.on { background:var(--text); border-color:var(--text); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:auto; }
  .key { height:56px; border-radius:16px; background:var(--surface); display:flex; align-items:center; justify-content:center; font:600 24px Inter; color:var(--text); }
  .key.nil { background:transparent; }
  .card { background:var(--surface); border-radius:20px; padding:16px; display:flex; gap:12px; align-items:flex-start; }
  .card.sand { background:var(--surface2); }
  .ban { border-radius:16px; padding:12px 14px; display:flex; gap:10px; align-items:flex-start; font:500 14px/20px Inter; }
  .ban.err { background:var(--dangerbg); color:var(--danger); }
  .ban.warn { background:var(--warnbg); color:var(--warn); }
  .ban.info { background:var(--infobg); color:var(--info); }
  .ban b { font-weight:700; }
  .chip { align-self:flex-start; display:inline-flex; align-items:center; gap:6px; background:var(--wabg); color:var(--wa); border-radius:999px; padding:4px 10px; font:600 13px Inter; }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .center { text-align:center; }
  .grow { flex:1; }
  .mark { width:56px; height:56px; border-radius:16px; background:var(--hero); color:#fff; display:flex; align-items:center; justify-content:center; font:800 28px "Plus Jakarta Sans", Inter, sans-serif; }
  .hero { background:var(--hero); color:#fff; border-radius:22px; margin:0 -8px; padding:22px 20px; display:flex; flex-direction:column; gap:10px; box-shadow:0 18px 30px -14px rgba(15,74,58,.55); }
  :root[data-t="dark"] .hero { border:1px solid rgba(255,255,255,.08); box-shadow:0 18px 30px -14px #000, 0 0 24px rgba(79,176,143,.12); }
  .hero .sub { color:#C9DED6; }
  .round { width:44px; height:44px; border-radius:22px; display:flex; align-items:center; justify-content:center; flex:none; }
  svg { flex:none; }
</style>
</head>
<body>
<div class="board" id="board"></div>
<script>
const T = new URLSearchParams(location.search).get('t') === 'dark' ? 'dark' : 'light';
document.documentElement.dataset.t = T;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// Icônes au trait (style Ionicons « outline ») dessinées ici — aucune image externe, aucun logo de marque.
const I = {
  back: (c) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`,
  chat: (c, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19.2z"/><path d="M9 10.5c.4 1.6 2 3.3 3.8 3.9l1.2-1.1 1.8.8-.4 1.4c-3.4.3-6.8-3-6.6-6.4l1.4-.4.8 1.8z" stroke-width="1.4"/></svg>`,
  sms: (c, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="3"/><path d="M8 17v3l4-3"/></svg>`,
  lock: (c, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>`,
  phone: (c, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>`,
  mail: (c, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg>`,
  alert: (c, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.1"/></svg>`,
  info: (c, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/></svg>`,
  wifi: (c, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M2.5 8.5a14 14 0 0 1 19 0M5.5 12a9.5 9.5 0 0 1 13 0M8.6 15.4a5 5 0 0 1 6.8 0M12 19v.1M3 3l18 18"/></svg>`,
  time: (c, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  down: (c) => `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`,
  del: (c) => `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><path d="M9 6h11v12H9l-6-6z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>`,
  flag: () => `<svg width="22" height="15" viewBox="0 0 3 2"><rect width="1" height="2" fill="#F77F00"/><rect x="1" width="1" height="2" fill="#FFFFFF"/><rect x="2" width="1" height="2" fill="#009E60"/></svg>`,
};

const sb = () => `<div class="sb"><span>9:41</span><span>●●● ▮</span></div>`;
const topBar = () => `<div class="top"><div class="back">${I.back(css('--text'))}</div></div>`;
const pad = () => `<div class="pad">${[1,2,3,4,5,6,7,8,9].map((n) => `<div class="key">${n}</div>`).join('')}<div class="key nil"></div><div class="key">0</div><div class="key nil">${I.del(css('--text'))}</div></div>`;
const dots = (n) => `<div class="dots">${[0,1,2,3,4,5].map((i) => `<div class="dot ${i < n ? 'on' : ''}"></div>`).join('')}</div>`;
const numberField = (value, focus = true) => `<div><div class="flab">Numéro de téléphone</div><div class="field ${focus ? 'focus' : ''}"><span class="cc">${I.flag()} +225 ${I.down(css('--text2'))}</span><span>${value}</span></div><div class="small" style="margin-top:6px">L’indicatif +225 est proposé ; touchez-le pour en choisir un autre.</div></div>`;
const boxes = (digits, err = false) => `<div class="boxes">${[0,1,2,3,4,5].map((i) => `<div class="box ${err ? 'err' : i === digits.length ? 'cur' : ''}">${digits[i] ?? ''}</div>`).join('')}</div>`;
const ban = (kind, icon, html) => `<div class="ban ${kind}">${icon}<div>${html}</div></div>`;

const S = {
  bienvenue: () => `${sb()}<div class="page" style="padding-top:28px">
    <div class="hero">
      <div class="mark" style="background:rgba(255,255,255,.12)">D</div>
      <h1 style="color:#fff">Votre argent, clair chaque jour</h1>
      <div class="sub">Suivez ce que vous dépensez, ce que vous mettez de côté et ce qu’il vous reste par jour.</div>
    </div>
    <div class="grow"></div>
    <div class="btn primary">${I.phone(css('--onbrand'), 20)} Continuer avec mon numéro</div>
    <div class="btn secondary">${I.mail(css('--text'))} J’ai un compte e-mail</div>
    <div style="display:flex;flex-direction:column;align-items:center"><span class="btn ghost" style="font-size:14px">Tester sans données (démonstration)</span><span class="btn ghost" style="font-size:14px">Utiliser sur ce téléphone uniquement</span></div>
    <div class="small center">DineroX ne détient pas votre argent : l’application vous aide à le suivre.</div>
  </div>`,
  numero: () => `${sb()}${topBar()}<div class="page">
    <h2>Votre numéro de téléphone</h2>
    <div class="sub">Nous vous envoyons un code sur <b>WhatsApp</b> pour vérifier que ce numéro est bien à vous.</div>
    ${numberField('07 08 09 10 11')}
    <div class="card sand"><div class="round" style="background:var(--wabg)">${I.chat(css('--wa'))}</div><div class="small" style="color:var(--text2)">Pas de WhatsApp sur ce numéro ? Vous pourrez recevoir le code <b>par SMS</b>.</div></div>
    <div class="grow"></div>
    <div class="btn primary">Recevoir le code</div>
    <div class="small center">En continuant, vous acceptez les Conditions d’utilisation et la Politique de confidentialité.</div>
  </div>`,
  code: () => `${sb()}${topBar()}<div class="page">
    <span class="chip">${I.chat(css('--wa'), 16)} Code envoyé sur WhatsApp</span>
    <h2>Entrez le code reçu</h2>
    <div class="sub">Envoyé au <b>+225 07 08 09 10 11</b> · <span class="link" style="font-size:15px">Modifier</span></div>
    ${boxes(['4','8','2'])}
    <div class="row small"><span>${I.time(css('--text3'), 14)} Le code expire dans 9:42</span></div>
    <div class="row"><span class="small">Renvoyer le code dans 0:45</span><span class="link">${I.sms(css('--brand'), 18)} Recevoir par SMS</span></div>
    <div class="grow"></div>
    <div class="btn disabled">Vérifier</div>
  </div>`,
  secret: () => `${sb()}${topBar()}<div class="page">
    <h2>Créez votre code secret</h2>
    <div class="sub">6 chiffres. Il vous servira à chaque connexion. Ne le donnez à personne — DineroX ne vous le demandera jamais par message.</div>
    ${dots(3)}
    <div class="small center">Évitez 123456, 000000 ou votre date de naissance.</div>
    ${pad()}
  </div>`,
  confirmer: () => `${sb()}${topBar()}<div class="page">
    <h2>Confirmez votre code secret</h2>
    <div class="sub">Tapez les mêmes 6 chiffres une seconde fois.</div>
    ${dots(5)}
    <div class="small center">Étape 2 sur 2</div>
    ${pad()}
  </div>`,
  connexion: (err) => `${sb()}${topBar()}<div class="page">
    <h2>Bon retour !</h2>
    <div class="card" style="align-items:center"><div class="round" style="background:var(--brandsoft)">${I.phone(css('--brand'))}</div><div class="grow"><div class="small">Votre numéro</div><div style="font:600 16px Inter">+225 07 08 •• •• 11</div></div><span class="link" style="font-size:14px">Changer</span></div>
    <div class="sub center">Votre code secret</div>
    ${dots(err ? 0 : 2)}
    ${err ? ban('err', I.lock(css('--danger'), 20), '<b>Trop d’essais.</b> Réessayez dans 15 minutes, ou touchez « Code secret oublié ? ».') : ''}
    <div class="row" style="justify-content:center;gap:16px"><span class="link" style="font-size:14px">Code secret oublié ?</span><span class="link" style="font-size:14px">J’ai un compte e-mail</span></div>
    ${pad()}
  </div>`,
  oublie: () => `${sb()}${topBar()}<div class="page">
    <h2>Code secret oublié ?</h2>
    <div class="sub">Pas de souci. Nous vérifions votre numéro avec un code reçu sur WhatsApp, puis vous choisissez un nouveau code secret.</div>
    <div class="card" style="align-items:center"><div class="round" style="background:var(--brandsoft)">${I.phone(css('--brand'))}</div><div class="grow"><div class="small">Code envoyé au</div><div style="font:600 16px Inter">+225 07 08 •• •• 11</div></div></div>
    ${ban('info', I.info(css('--info')), 'Vos opérations, vos comptes et votre abonnement ne changent pas.')}
    <div class="grow"></div>
    <div class="btn primary">Recevoir le code</div>
    <div class="btn ghost">Annuler</div>
  </div>`,
  nouveau: () => `${sb()}${topBar()}<div class="page">
    <div class="round" style="background:var(--brandsoft);width:64px;height:64px;border-radius:32px">${I.phone(css('--brand'), 30)}</div>
    <h2>Nouveau téléphone</h2>
    <div class="sub">Pour protéger votre compte, confirmez votre numéro avec un code reçu sur WhatsApp. C’est demandé une seule fois sur ce téléphone.</div>
    <div class="card" style="align-items:center"><div class="round" style="background:var(--wabg)">${I.chat(css('--wa'))}</div><div class="grow"><div class="small">Code envoyé au</div><div style="font:600 16px Inter">+225 07 08 •• •• 11</div></div></div>
    <div class="grow"></div>
    <div class="btn primary">Recevoir le code</div>
    <div class="btn ghost">Ce n’est pas mon numéro</div>
  </div>`,
  ajouter: () => `${sb()}<div class="top"><div class="back">${I.back(css('--text'))}</div><h2 style="font-size:22px">Ajouter mon numéro</h2></div><div class="page">
    <div class="card sand">${I.info(css('--text2'))}<div class="small" style="color:var(--text2)">Votre compte reste le même : <b>mêmes données, même abonnement</b>. Ensuite, vous pourrez vous connecter avec votre numéro <b>ou</b> avec votre e-mail.</div></div>
    ${numberField('07 08 09 10 11')}
    <div class="small">Nous vous envoyons un code sur WhatsApp (ou par SMS), puis vous choisissez un code secret.</div>
    <div class="grow"></div>
    <div class="btn primary">Recevoir le code</div>
  </div>`,
  // ─── Messages d'erreur ───
  errCode: () => `${sb()}${topBar()}<div class="page">
    <span class="chip">${I.chat(css('--wa'), 16)} Code envoyé sur WhatsApp</span>
    <h2>Entrez le code reçu</h2>
    <div class="sub">Envoyé au <b>+225 07 08 09 10 11</b></div>
    ${boxes(['4','8','2','9','1','5'], true)}
    ${ban('err', I.alert(css('--danger')), '<b>Code incorrect.</b> Il vous reste 3 essais.')}
    <div class="row"><span class="link" style="font-size:14px">Renvoyer le code</span><span class="link" style="font-size:14px">${I.sms(css('--brand'), 18)} Recevoir par SMS</span></div>
    <div class="grow"></div>
    <div class="btn primary">Vérifier</div>
  </div>`,
  errEssais: () => S.connexion(true),
  errExpire: () => `${sb()}${topBar()}<div class="page">
    <span class="chip">${I.chat(css('--wa'), 16)} Code envoyé sur WhatsApp</span>
    <h2>Entrez le code reçu</h2>
    <div class="sub">Envoyé au <b>+225 07 08 09 10 11</b></div>
    ${boxes([])}
    ${ban('warn', I.time(css('--warn')), '<b>Ce code a expiré.</b> Pour votre sécurité, un code ne sert que 10 minutes. Demandez-en un nouveau.')}
    <div class="grow"></div>
    <div class="btn primary">Renvoyer le code</div>
    <div class="btn ghost">${I.sms(css('--brand'), 18)} Recevoir par SMS</div>
  </div>`,
  errReseau: () => `${sb()}${topBar()}<div class="page">
    <h2>Votre numéro de téléphone</h2>
    <div class="sub">Nous vous envoyons un code sur <b>WhatsApp</b> pour vérifier que ce numéro est bien à vous.</div>
    ${numberField('07 08 09 10 11', false)}
    ${ban('err', I.wifi(css('--danger')), '<b>Pas de connexion Internet.</b> Vérifiez vos données mobiles ou le Wi-Fi, puis réessayez. Aucun code n’a été envoyé.')}
    <div class="grow"></div>
    <div class="btn primary">Réessayer</div>
  </div>`,
};

const SCREENS = [
  ['01-bienvenue', '1. Bienvenue', 'bienvenue'],
  ['02-numero', '2. Saisie du numéro (+225 proposé, modifiable)', 'numero'],
  ['03-code-whatsapp', '3. Code reçu sur WhatsApp (6 cases, Renvoyer, Recevoir par SMS)', 'code'],
  ['04a-code-secret', '4. Création du code secret', 'secret'],
  ['04b-confirmation', '4 bis. Confirmation du code secret', 'confirmer'],
  ['05-connexion', '5. Connexion (numéro + code secret)', 'connexion'],
  ['06-code-oublie', '6. Code secret oublié', 'oublie'],
  ['07-nouveau-telephone', '7. Nouveau téléphone', 'nouveau'],
  ['08-ajouter-numero', '8. Compte e-mail existant : « Ajouter mon numéro »', 'ajouter'],
  ['09-erreur-mauvais-code', 'Erreur : mauvais code', 'errCode'],
  ['10-erreur-trop-essais', 'Erreur : trop d’essais', 'errEssais'],
  ['11-erreur-code-expire', 'Erreur : code expiré', 'errExpire'],
  ['12-erreur-pas-de-reseau', 'Erreur : pas de réseau', 'errReseau'],
];

document.getElementById('board').innerHTML = SCREENS.map(([id, label, key]) =>
  `<div class="wrap"><div class="lab">${label} · ${T === 'dark' ? 'sombre' : 'clair'} · 360 × 800</div><div class="phone" data-id="${id}">${S[key]()}</div></div>`).join('');
</script>
</body>
</html>
