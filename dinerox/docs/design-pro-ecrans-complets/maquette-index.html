<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DineroX — Directions</title>
<!--
  Maquettes de l'étape 2 (design-pro). Polices et icônes = fichiers embarqués de l'application
  (Inter, Plus Jakarta Sans, Ionicons). Chiffres = démonstration de l'application au 2026-10-21.
  Paramètres :
    ?board=a | ?board=b      planche d'une direction (spécifications + 6 écrans)
    ?board=cards             les trois versions de la carte d'accueil
    ?d=a&s=home&t=light      un seul écran, à la taille de la fenêtre (téléphone)
    &card=a|b                version de la carte d'accueil (par défaut : a pour A, b pour B ;
                             la carte (c) est abandonnée, décision du fondateur du 2026-10-21)
    ?d=b&s=homefull&t=…      accueil COMPLET (carte b), à faire défiler, avec la place des
                             cartes qui n'apparaissent que selon la situation
-->
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(fonts/Inter_400Regular.ttf); }
@font-face { font-family: Inter; font-weight: 500; src: url(fonts/Inter_500Medium.ttf); }
@font-face { font-family: Inter; font-weight: 600; src: url(fonts/Inter_600SemiBold.ttf); }
@font-face { font-family: Inter; font-weight: 700; src: url(fonts/Inter_700Bold.ttf); }
@font-face { font-family: Jakarta; font-weight: 600; src: url(fonts/PlusJakartaSans_600SemiBold.ttf); }
@font-face { font-family: Jakarta; font-weight: 700; src: url(fonts/PlusJakartaSans_700Bold.ttf); }
@font-face { font-family: Jakarta; font-weight: 800; src: url(fonts/PlusJakartaSans_800ExtraBold.ttf); }
@font-face { font-family: Ionicons; src: url(fonts/Ionicons.ttf); }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #DADCDF; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
body.single { background: var(--bg); }
.ic { font-family: Ionicons; font-style: normal; line-height: 1; display: inline-block; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

/* ── Planche ─────────────────────────────────────────────────────────── */
.board { padding: 48px; display: flex; flex-direction: column; gap: 40px; width: max-content; }
.board h1 { font: 700 32px/40px Inter; color: #111; }
.board h2 { font: 600 18px/24px Inter; color: #333; margin-bottom: 12px; }
.board .lede { font: 400 15px/22px Inter; color: #444; max-width: 900px; }
.row { display: flex; gap: 32px; align-items: flex-start; }
.frame-wrap { display: flex; flex-direction: column; gap: 8px; }
.frame-label { font: 500 13px/18px Inter; color: #444; }
.spec { background: #fff; border-radius: 12px; padding: 24px; display: flex; gap: 40px; }
.spec section { min-width: 220px; }
.swatches { display: grid; grid-template-columns: repeat(2, auto); gap: 8px 16px; }
.sw { display: flex; align-items: center; gap: 8px; font: 400 12px/16px Inter; color: #333; }
.sw i { width: 28px; height: 28px; border-radius: 6px; border: 1px solid rgba(0,0,0,.12); display: block; }
.spec p { font: 400 13px/20px Inter; color: #333; }
.spec .type-sample { margin: 4px 0; color: #111; }
.icons-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 24px; color: #222; max-width: 260px; }

/* ── Écran (360 × 800) ────────────────────────────────────────────────── */
.phone { width: 360px; height: 800px; background: var(--bg); color: var(--text); position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: var(--body); }
body.single .phone { height: var(--vh, 100vh); width: 360px; }
.status { height: 24px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font: 500 12px/16px Inter; color: var(--text); }
body.single .status { display: none; }
.scroll { flex: 1; overflow: hidden; padding: 0 16px; }
.t-caption { font: 500 13px/18px var(--body); color: var(--text2); }
.t-small { font: 400 13px/18px var(--body); color: var(--text3); }
.t-body { font: 400 15px/22px var(--body); color: var(--text); }
.t-strong { font: 600 15px/22px var(--body); color: var(--text); }
.t-title { font: var(--titleW) 22px/28px var(--title); color: var(--text); letter-spacing: -0.2px; }
.t-section { font: 600 17px/24px var(--title); color: var(--text); }
.hero-num { font: var(--numW) 40px/44px var(--title); letter-spacing: -0.8px; }
.hero-num small { font: 600 18px/22px var(--body); letter-spacing: 0; margin-left: 4px; }

.topbar { height: 56px; display: flex; align-items: center; justify-content: space-between; }
.space-btn { display: flex; align-items: center; gap: 4px; font: 600 15px/20px var(--body); color: var(--text); height: 48px; }
.space-btn .ic { font-size: 16px; color: var(--text2); }
.top-actions { display: flex; align-items: center; gap: 4px; }
.icon-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: var(--text); }
.avatar { width: 32px; height: 32px; border-radius: 16px; background: var(--surface2); color: var(--text); font: 600 14px/32px var(--body); text-align: center; }

.card { background: var(--surface); border-radius: var(--r-card); border: var(--card-border); box-shadow: var(--card-shadow); }
.rows .r { display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 0 16px; }
.rows .r + .r { border-top: 1px solid var(--divider); }
.rows .r .v { font: 600 15px/22px var(--body); font-variant-numeric: tabular-nums; }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.act { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 8px; font: 500 13px/18px var(--body); color: var(--text); }
.act .bub { width: 44px; height: 44px; border-radius: 22px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--brandInk); }

.sec-head { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 0 8px; }
.link { font: 600 15px/20px var(--body); color: var(--brandInk); }

.tx { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 16px; }
.tx + .tx { border-top: 1px solid var(--divider); }
.tx .bub { flex: none; width: 40px; height: 40px; border-radius: var(--r-icon); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--iconInk); }
.tx .mid { flex: 1; min-width: 0; }
.tx .mid div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .amt { font: 600 15px/22px var(--body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.in { color: var(--positive); }

.alert-row { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; }
.alert-row .ic { font-size: 22px; }
.alert-row .chev { margin-left: auto; color: var(--text3); font-size: 18px; }

.tabbar { flex: none; height: 64px; background: var(--tabbg); border-top: 1px solid var(--divider); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font: 500 12px/16px var(--body); color: var(--text3); }
.tab .ic { font-size: 24px; }
.tab.on { color: var(--brandInk); font-weight: 600; }
.tab.mic .ic { width: 48px; height: 36px; border-radius: 18px; background: var(--brand); color: var(--onBrand); font-size: 22px; display: flex; align-items: center; justify-content: center; }
.tab.mic { color: var(--text); }

.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--brand); }
.bar i.over { background: var(--alert); }
.bar i.full { background: var(--warning); }

/* Feuille de saisie */
.sheet-dim { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 40px; background: var(--sheet); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 8px 16px 0; display: flex; flex-direction: column; }
body.single .sheet { top: 16px; }
.handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface2); border-radius: var(--r-ctl); padding: 3px; }
.seg div { height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 14px/20px var(--body); color: var(--text2); border-radius: calc(var(--r-ctl) - 3px); }
.seg .on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.underline-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--divider); }
.underline-tabs div { height: 44px; display: flex; align-items: center; gap: 6px; font: 600 15px/20px var(--body); color: var(--text3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.underline-tabs .on { color: var(--text); border-color: var(--text); }
.amount { text-align: center; font: var(--numW) 44px/52px var(--title); color: var(--text3); letter-spacing: -0.8px; margin: 16px 0 12px; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--key-gap); }
.key { height: 52px; border-radius: var(--r-ctl); background: var(--keybg); display: flex; align-items: center; justify-content: center; font: 500 24px/28px var(--title); color: var(--text); }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 4px; margin-top: 8px; }
.cat { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 12px/16px var(--body); color: var(--text); text-align: center; }
.cat .bub { width: 48px; height: 48px; border-radius: var(--r-icon); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--iconInk); }

/* Enveloppes */
.env { padding: 12px 16px; }
.env + .env { border-top: 1px solid var(--divider); }
.env .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.env .bub { width: 36px; height: 36px; border-radius: var(--r-icon); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--iconInk); flex: none; }
.env .st { margin-left: auto; font: 600 13px/18px var(--body); white-space: nowrap; }
.st.over { color: var(--alert); } .st.full { color: var(--warning); } .st.ok { color: var(--text3); font-weight: 500; }

/* Carte d'accueil : trois versions */
.hc-a .hero-num { color: var(--text); }
.hc-b { background: var(--heroBg); color: #fff; border-radius: var(--r-hero); position: relative; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.10); }
.hc-b::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid rgba(255,255,255,.10); pointer-events: none; }
.hc-b .pattern { position: absolute; right: -6px; top: -6px; width: 118px; height: 118px; opacity: .10; }
.hc-b .t-caption, .hc-b .t-small { color: rgba(255,255,255,.78); }
.hc-b .rows .r + .r { border-top-color: rgba(255,255,255,.14); }
.hc-b .rows .r span:first-child { color: rgba(255,255,255,.82); font: 400 15px/22px var(--body); }
.hc-b .rows .r .v { color: #fff; }
/* Textes sur le vert : blanc 10,2:1 (clair) / 12,6:1 (sombre) ; secondaire #C9DED6 7,2:1 / 8,9:1 (AA). */
.hc-b .t-caption, .hc-b .t-small { color: #C9DED6; }
.hc-b .rows .r span:first-child { color: #C9DED6; }

/* ── Accueil COMPLET (s=homefull) : page qui défile, barre d'onglets collée en bas ── */
body.full .phone { height: auto; min-height: 0; overflow: visible; }
body.full .scroll { overflow: visible; padding-bottom: 24px; }
body.full .tabbar { position: sticky; bottom: 0; z-index: 5; }
.hello { font: var(--titleW) 22px/28px var(--title); color: var(--text); margin: 4px 0 12px; }
.banner { display: flex; gap: 12px; padding: 12px 16px; border-radius: var(--r-card); background: var(--surface2); margin-bottom: 12px; }
.banner .ic { font-size: 22px; color: var(--text2); flex: none; }
.hc-b.full .body { position: relative; padding: 20px 16px 8px; }
.hc-b .sentence { font: 600 15px/22px var(--body); color: #fff; margin-top: 4px; }
.hc-b .sep { height: 1px; background: rgba(255,255,255,.14); margin: 12px 0; }
.hc-b .line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-height: 28px; }
.hc-b .line span:first-child { font: 400 14px/20px var(--body); color: #C9DED6; }
.hc-b .line .v { font: 600 15px/22px var(--body); color: #fff; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hc-b .line.main .v { font: 700 19px/26px var(--title); }
.hc-b .cap { font: 400 13px/18px var(--body); color: #C9DED6; margin: -2px 0 4px; }
.hc-b .hide { display: flex; align-items: center; gap: 8px; min-height: 48px; font: 600 15px/20px var(--body); color: #fff; margin-top: 4px; }
.hc-b .hide .ic { font-size: 22px; }
.how { display: flex; align-items: center; gap: 8px; min-height: 48px; font: 600 15px/20px var(--body); color: var(--brandInk); }
.how .ic { font-size: 20px; }
.shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 12px; }
.shortcuts .sc { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; background: var(--surface); border-radius: var(--r-ctl); box-shadow: var(--card-shadow); font: 600 15px/20px var(--body); color: var(--text); }
.shortcuts .sc .ic { font-size: 20px; color: var(--brandInk); }
.shortcuts .sc.w { grid-column: 1 / -1; }
.prompt { padding: 16px; }
.prompt .row2 { display: flex; gap: 8px; margin-top: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: var(--r-ctl); font: 600 15px/20px var(--body); }
.btn.pri { background: var(--brand); color: var(--onBrand); }
.btn.sec { background: var(--surface2); color: var(--text); }
.btn.ter { color: var(--brandInk); padding: 0 8px; }
.btn.sm { min-height: 44px; font-size: 14px; padding: 0 12px; }
.btn .ic { font-size: 18px; }
.ins { padding: 12px 16px 4px; }
.ins + .ins { border-top: 1px solid var(--divider); }
.ins .top { display: flex; gap: 10px; align-items: flex-start; }
.ins .top .ic { font-size: 20px; margin-top: 1px; flex: none; }
.ins .chev { margin-left: auto; color: var(--text3); }
.listen { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font: 600 14px/20px var(--body); color: var(--brandInk); }
.listen .ic { font-size: 18px; }
.mrow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; }
.mrow + .mrow { border-top: 1px solid var(--divider); }
.mrow .bub { width: 36px; height: 36px; border-radius: var(--r-icon); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--iconInk); flex: none; }
.mrow .v { margin-left: auto; font: 600 15px/22px var(--body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.note { font: 400 13px/18px var(--body); color: var(--text3); margin-top: 6px; }
.src { display: inline-block; font: 500 12px/16px var(--body); color: var(--text3); margin-top: 6px; }
.coach { padding: 16px; }
.coach p { font: 400 14px/20px var(--body); color: var(--text); margin-top: 8px; }
.envl { padding: 12px 16px; }
.envl + .envl { border-top: 1px solid var(--divider); }
.envl .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.envl .bub, .goal .bub { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; }
.envl .st { margin-left: auto; font: 600 13px/18px var(--body); white-space: nowrap; }
.goal { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
.goal + .goal { border-top: 1px solid var(--divider); }
.goal .mid { flex: 1; min-width: 0; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }
.tile { padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
.tile .ic { font-size: 22px; color: var(--brandInk); }
.tag { display: inline-block; font: 600 11px/16px var(--body); color: var(--text2); background: var(--surface2); border-radius: 6px; padding: 1px 6px; }
.sit { border: 1.5px dashed var(--border); border-radius: calc(var(--r-card) + 4px); padding: 6px; margin-bottom: 12px; }
.sit > .sit-l { font: 600 11px/16px Inter; color: var(--text3); letter-spacing: .2px; padding: 0 6px 6px; text-transform: uppercase; }
.sit .card { padding: 14px 16px; }
.sit .card .ttl { display: flex; gap: 10px; align-items: flex-start; font: 600 15px/22px var(--body); color: var(--text); }
.sit .card .ttl .ic { font-size: 20px; margin-top: 1px; flex: none; color: var(--brandInk); }
.sit .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.sits-h { font: 700 13px/18px Inter; color: var(--text2); margin: 4px 0 8px; }

/* ── Décisions du 2026-10-21 : pavés regroupés, ronds de couleur pleine ── */
.cc { width: 46px; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; flex: none; }
body.dark .cc { color: #13120F; }
.cc.vert { background: #1E6B52; } .cc.or { background: #9A6400; } .cc.violet { background: #7B3F70; } .cc.bleu { background: #2D5F8F; } .cc.terre { background: #B0502A; }
body.dark .cc.vert { background: #7FD1B0; } body.dark .cc.or { background: #E8B85A; } body.dark .cc.violet { background: #D79CCB; } body.dark .cc.bleu { background: #8DB8E3; } body.dark .cc.terre { background: #F09A75; }
.grp { display: grid; grid-template-columns: repeat(3, 1fr); padding: 14px 6px 4px; }
.grp.two { grid-template-columns: repeat(2, 1fr); }
.gc { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 0 4px 14px; }
.gc .lab { font: 600 12.5px/16px var(--body); color: var(--text); }
.gc .sub { font: 400 12px/16px var(--body); color: var(--text3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font: 600 12px/16px var(--body); color: var(--text2); background: var(--surface2); border-radius: 6px; padding: 2px 8px; }
.chip.p { color: var(--brandInk); }
.gacts { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.gacts .btn { flex: 1; }
.ib { width: 44px; height: 44px; border-radius: 12px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text); }
.h1row { display: flex; align-items: center; gap: 10px; margin: 4px 0 2px; }
.h1row .badge { font: 600 12px/16px var(--body); color: var(--positive); background: var(--surface2); border-radius: 999px; padding: 3px 10px; }
.h1row .plus { margin-left: auto; width: 48px; height: 48px; border-radius: 14px; background: var(--brand); color: var(--onBrand); display: flex; align-items: center; justify-content: center; font-size: 26px; }
.gh { padding: 18px 16px 16px; position: relative; }
.gh .top { display: flex; align-items: center; gap: 8px; font: 600 12px/16px var(--body); letter-spacing: .6px; color: #C9DED6; }
.gh .pill { white-space: nowrap; margin-left: auto; background: rgba(255,255,255,.16); color: #fff; border-radius: 999px; padding: 3px 10px; font: 700 12px/16px var(--body); letter-spacing: 0; }
.gh .wbar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.22); margin-top: 14px; overflow: hidden; }
.gh .wbar i { display: block; height: 100%; background: #E8B85A; border-radius: 4px; }
.gh .foot { display: flex; justify-content: space-between; margin-top: 10px; font: 500 12px/16px var(--body); color: #C9DED6; }
.gh .foot b { color: #fff; font-weight: 600; }
.mini { font: 400 13px/18px var(--body); color: var(--text3); }


/* ── Essais du 2026-10-21 : carte flottante et fond vert dégradé ── */
body.float .hc-b { box-shadow: 0 28px 44px -16px rgba(15,74,58,.70), 0 12px 20px -8px rgba(15,74,58,.40), 0 2px 4px rgba(15,74,58,.20); }
body.float .hc-b.full { margin: 0 4px 6px; }
body.float.dark .hc-b { box-shadow: 0 24px 36px -12px rgba(0,0,0,.75), 0 8px 16px -6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10); }
body.float .hc-b.full { margin: 0 2px; }
body.g1 .phone { background: linear-gradient(180deg, #CFE6DA 0px, #E3EFE8 420px, #F4F1EA 1200px); }
body.g2 .phone { background: linear-gradient(180deg, #A8D2BE 0px, #CDE5D8 360px, #E2F0E8 900px, #EAF4EE 100%); }
body.g1.dark .phone { background: linear-gradient(180deg, #17483A 0px, #142A23 420px, #13120F 1200px); }
body.g2.dark .phone { background: linear-gradient(180deg, #1F5A48 0px, #163A2F 360px, #10241D 900px, #0E1D18 100%); }
body.g1 .tabbar, body.g2 .tabbar { background: var(--tabbg); }
body.g1 .banner, body.g2 .banner { background: rgba(255,255,255,.55); }
body.g1.dark .banner, body.g2.dark .banner { background: rgba(255,255,255,.07); }

body.full .tx { padding-top: 10px; padding-bottom: 10px; align-items: center; }
body.full .tx .mid div { white-space: normal; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ── Jetons ────────────────────────────────────────────────────────────────

}

    <div class="sec-head"><div class="t-section">Enveloppes</div><div class="link">6</div></div>
    <div class="card">${env.map(([f, n, s2, l, st, d2, pc]) => `<div class="envl"><div class="top">${bub3d(f)}<div style="min-width:0"><div class="t-strong">${n}</div><div class="t-small">${s2}</div></div><div class="st ${st}">${l}</div></div><div class="bar"><i class="${st}" style="width:${Math.min(100, pc)}%"></i></div><div class="t-small num" style="margin-top:6px">${d2}</div></div>`).join('')}</div>
    <div class="card" style="margin-top:12px"><div class="grp two">

      <div class="gc"><div class="cc violet">${ic('sparkles')}</div><div class="lab">Budget automatique</div></div>
    </div></div>
  </div>${tabbar('budget')}`;
}

    <div class="hc-b">${PATTERN}<div class="gh">

    <div class="sec-head"><div class="t-section">Moments forts de l'année</div></div>

    <div style="margin-top:16px">${b('pri', 'Créer un nouvel objectif', 'add-circle-outline').replace('btn sm pri', 'btn pri').replace('class="btn', 'style="width:100%" class="btn')}</div>

    <div class="sec-head"><div class="t-section">Répartir ce qui me reste chaque mois</div></div>
    <div class="card" style="padding:16px"><div class="mini">Les objectifs prioritaires sont financés en premier.</div>
      <div class="t-caption" style="margin-top:12px">Ce qui me reste chaque mois</div>
      <div style="margin-top:6px;min-height:48px;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;padding:0 14px;font:600 17px/22px var(--body)" class="num">55 750 FCFA</div>
      <div class="rows" style="margin:12px -16px -16px;border-top:1px solid var(--divider)">${[['Ma moto', '75 000 FCFA / mois', '55 000 FCFA'], ['Mon fonds d\'urgence', '25 000 FCFA / mois', '0 FCFA']].map(([n, sub, v]) => `<div class="r" style="min-height:56px"><span><span class="t-strong" style="display:block">${n}</span><span class="mini">${sub}</span></span><span class="v">${v}</span></div>`).join('')}</div>
    </div>
  </div>${tabbar('goals')}`;
}

let SIT = true;

// Espaces insécables dans les montants (comme groupDigits dans l'application : U+00A0).
const nb = (html) => html.replace(/(\d) (?=\d{3}\b)/g, '$1\u00A0').replace(/(\d) (FCFA|%)/g, '$1\u00A0$2');

const SCREENS = { home: ['Accueil', home], entry: ['Saisie', entry], budget: ['Budget', budget], homefull: ['Accueil complet', homefull], budgetfull: ['Budget complet', budgetfull], goalsfull: ['Objectifs complet', goalsfull] };
const phone = (d, s, t, card) => `<div class="phone" style="${vars(d, t)}">${SCREENS[s][1](d, card)}</div>`;

function spec(d) {
  const k = T[d], L = k.light, Dk = k.dark;
  const sw = (c, n) => `<div class="sw"><i style="background:${c}"></i>${n} <b>${c}</b></div>`;
  const keys = [['bg', 'Fond'], ['surface', 'Surface'], ['surface2', 'Surface 2'], ['divider', 'Filet'], ['text', 'Texte'], ['text2', 'Texte 2'], ['text3', 'Texte 3'], ['brand', 'Marque'], ['positive', 'Entrée'], ['alert', 'Alerte'], ['warning', 'Attention']];
  return `<div class="spec">
    <section><h2>Palette — clair</h2><div class="swatches">${keys.map(([x, n]) => sw(L[x], n)).join('')}</div></section>
    <section><h2>Palette — sombre</h2><div class="swatches">${keys.map(([x, n]) => sw(Dk[x], n)).join('')}</div></section>
    <section><h2>Typographie</h2>
      <p class="type-sample" style="font:${k.fonts.numW} 40px/44px ${k.fonts.title}; font-variant-numeric:tabular-nums">38 681</p>
      <p class="type-sample" style="font:${k.fonts.titleW} 22px/28px ${k.fonts.title}">Titre d'écran 22</p>
      <p class="type-sample" style="font:600 17px/24px ${k.fonts.title}">Titre de section 17</p>
      <p class="type-sample" style="font:400 15px/22px Inter">Texte courant 15 — Inter</p>
      <p class="type-sample" style="font:500 13px/18px Inter">Légende 13 — Inter</p>
      <p style="margin-top:8px">${k.fonts.title === 'Inter' ? 'Une seule police : Inter (embarquée).' : 'Plus Jakarta Sans pour les titres et le chiffre principal, Inter pour le texte (toutes deux embarquées).'}<br>Montants en chiffres tabulaires (alignés).</p>
    </section>
    <section><h2>Grille et formes</h2><p>Grille de 4 / 8 dp. Marges latérales 16. Espacement entre blocs 12 / 24.<br>Rayons : cartes ${k.radius.card}, champs et touches ${k.radius.ctl}, feuilles ${k.radius.sheet}, icônes ${k.radius.icon === 20 ? 'cercles' : k.radius.icon}.<br>${d === 'a' ? 'Aucune ombre : des filets de 1 dp.' : 'Ombre très légère en clair (1 dp), aucune en sombre.'}<br>Zones de toucher ≥ 48 dp. Aucun dégradé.</p>
      <h2 style="margin-top:16px">Icônes</h2><div class="icons-row">${['home-outline', 'pie-chart-outline', 'flag-outline', 'grid-outline', 'notifications-outline', 'swap-horizontal', 'time-outline', 'restaurant-outline', 'car-outline', 'heart-outline', 'wallet-outline', 'alert-circle-outline'].map((n) => ic(n)).join('')}</div><p style="margin-top:6px">Ionicons « outline », un seul trait, une seule couleur d'icône (${d === 'a' ? 'encre' : 'vert de marque'}), sur fond neutre.</p></section>
  </div>`;
}

function board(d) {
  if (d === 'cards') {
    const labels = { a: '(a) Chiffre posé sur le fond, détails dans une carte neutre', b: '(b) Vert profond uni, fin filet, motif discret, ombre très légère — RETENUE' };
    return `<div class="board"><h1>Carte d'accueil</h1><p class="lede">Version retenue : (b), dans la direction B. La version (c) est abandonnée (décision du fondateur, 2026-10-21). Mêmes données, mêmes textes. Aucun dégradé.</p>
      ${['a', 'b'].map((dir) => ['light', 'dark'].map((t) => `<div class="row">${['a', 'b'].map((v) => `<div class="frame-wrap"><div class="frame-label">${T[dir].name} · ${labels[v]} · ${t === 'light' ? 'clair' : 'sombre'}</div><div class="phone" style="${vars(dir, t)}; height:auto; padding:16px">${heroCard(v)}</div></div>`).join('')}</div>`).join('')).join('')}</div>`;
  }
  if (d === 'icons') {
    ICONS3D = true;
    return `<div class="board"><h1>Icônes 3D en situation — direction B, carte (b)</h1><p class="lede">Accueil (Dernières opérations) et Saisie (catégories), clair et sombre. Icônes : Fluent Emoji 3D (MIT), teinte moyenne-foncée, icônes composées validées ; en sombre, léger rond clair derrière chaque icône de contenu.</p>
      ${['light', 'dark'].map((t) => `<div class="row">${['home', 'entry'].map((s) => `<div class="frame-wrap"><div class="frame-label">${SCREENS[s][0]} · ${t === 'light' ? 'clair' : 'sombre'} · 360 × 800</div>${phone('b', s, t, 'b')}</div>`).join('')}</div>`).join('')}</div>`;
  }
  const card = d === 'a' ? 'a' : 'b';
  return `<div class="board"><h1>${T[d].name}</h1>${spec(d)}
    ${['light', 'dark'].map((t) => `<div class="row">${Object.keys(SCREENS).map((s) => `<div class="frame-wrap"><div class="frame-label">${SCREENS[s][0]} · ${t === 'light' ? 'clair' : 'sombre'} · 360 × 800</div>${phone(d, s, t, card)}</div>`).join('')}</div>`).join('')}</div>`;
}

(async () => {
  G = await (await fetch('glyphs.json')).json();
  await document.fonts.ready;
  const q = new URLSearchParams(location.search);
  const root = document.getElementById('root');
  if (q.get('board')) { root.innerHTML = board(q.get('board')); }
  else {
    const d = q.get('d') || 'a', t = q.get('t') || 'light';
    ICONS3D = q.get('icons') === '3d' || (q.get('s') || '').endsWith('full');
    SIT = q.get('sit') !== '0';
    document.body.classList.add('single');
    if ((q.get('s') || '').endsWith('full')) document.body.classList.add('full');
    document.body.classList.add(t);
    if (q.get('float') === '1') document.body.classList.add('float');
    if (q.get('bg')) document.body.classList.add(q.get('bg'));
    document.documentElement.style.setProperty('--vh', innerHeight + 'px');
    document.body.setAttribute('style', vars(d, t));
    root.innerHTML = nb(phone(d, q.get('s') || 'home', t, q.get('card') || (d === 'a' ? 'a' : 'b')));
  }
  await document.fonts.ready;
  document.body.dataset.ready = '1';
})();
</script>
