<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DineroX — Logos à valider</title>
<!-- Aperçu des fichiers de logos trouvés sur les sites officiels (voir SOURCES.md). Rien n'est intégré. -->
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(../directions/fonts/Inter_400Regular.ttf); }
@font-face { font-family: Inter; font-weight: 600; src: url(../directions/fonts/Inter_600SemiBold.ttf); }
@font-face { font-family: Jakarta; font-weight: 700; src: url(../directions/fonts/PlusJakartaSans_700Bold.ttf); }
:root { --bg: #F4F1EA; --surface: #FFFCF7; --divider: #EAE3D7; --text: #1F1C17; --text2: #564E43; --text3: #6E6558; --warn: #8A5A00; --alert: #B3261E; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 400 14px/20px Inter, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
h1 { font: 700 22px/28px Jakarta, Inter; margin-bottom: 4px; }
.lede { color: var(--text2); margin-bottom: 12px; }
.card { background: var(--surface); border-radius: 16px; padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(60,45,20,.08); }
.op { font: 700 16px/22px Jakarta, Inter; }
.file { font: 600 12px/16px Inter; color: var(--text2); word-break: break-all; margin-top: 2px; }
.src { font: 400 11px/15px Inter; color: var(--text3); word-break: break-all; margin-top: 2px; }
.verdict { font: 600 12px/16px Inter; color: var(--warn); margin-top: 4px; }
.verdict.no { color: var(--alert); }
.views { display: flex; gap: 8px; margin-top: 8px; }
.view { flex: 1; min-width: 0; height: 104px; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 8px; }
.view.light { background: #FFFFFF; border: 1px solid var(--divider); }
.view.dark { background: #1D1B17; }
.view img { max-width: 100%; max-height: 88px; object-fit: contain; }
.size { font: 400 11px/14px Inter; color: var(--text3); margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Logos à valider</h1>
  <p class="lede">Fichiers trouvés sur les sites officiels des opérateurs, copiés <b>tels quels</b>, montrés sur fond clair et sur fond sombre. <b>Aucun opérateur ne publie de kit de presse</b> : détail et solutions dans SOURCES.md. Rien n'est intégré.</p>
  <div id="list"></div>
</div>
<script>
const L = [
  ['Orange Money', 'orange-money_developer-orange-com.jpg', 'developer.orange.com/od-uploads/orange-money-logo-300x255.jpg', 'JPG 300 × 255, fond gris opaque, 255 px de haut', false],
  ['Orange (marque mère)', 'orange_orange-ci.svg', 'orange.ci/particuliers/resources/img/master-logo.svg', 'SVG ; logo Orange, pas Orange Money', false],
  ['MTN', 'mtn_mtn-ci.svg', 'mtn.ci/wp-content/uploads/2023/01/mtn-logo.svg', 'SVG ; logo MTN, pas MoMo', false],
  ['MTN MoMo', 'mtn-momo-icone_mtn-ci.png', 'mtn.ci/wp-content/uploads/2023/02/icone-momo.png', 'PNG 50 × 50 : trop petit', true],
  ['Wave', 'wave-icone_wave-com.png', 'wave.com/img/favicon.png', 'PNG 192 × 192 : icône de l’application', false],
  ['Wave', 'wave-logo_wave-com.png', 'wave.com/img/nav-logo.png', 'PNG 230 × 101 : trop petit, horizontal', true],
  ['Moov Africa', 'moov-africa_moov-africa-ci.png', 'moov-africa.ci/wp-content/uploads/2025/08/LOGO-MOOV-AFRICA_Plan-de-travail-1.png', 'PNG 2560 × 1468 ; Moov Africa, pas Moov Money ; texte blanc', false],
  ['Airtel', 'airtel_airtel-africa.png', 'airtel.africa/sites/default/files/airtel-logo_0.png', 'PNG 272 × 70 ; Airtel, pas Airtel Money', false],
];
document.getElementById('list').innerHTML = L.map(([op, f, src, v, no]) => `<div class="card">
  <div class="op">${op}</div><div class="file">${f}</div><div class="src">Source : https://${src}</div>
  <div class="verdict${no ? ' no' : ''}">${v}</div>
  <div class="views"><div class="view light"><img src="${f}" alt=""></div><div class="view dark"><img src="${f}" alt=""></div></div></div>`).join('')
  + `<div class="card"><div class="op">Free Money</div><div class="verdict no">Rien trouvé : free.sn injoignable le 21 octobre 2026.</div></div>`;
Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((ok) => { im.onload = im.onerror = ok; })))).then(() => document.fonts.ready).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
