<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DineroX — Logos des opérateurs</title>
<!-- Logos des opérateurs (décision du fondateur, 2026-10-21) : clair et sombre, 48 et 32 dp,
     d'après ../icones/operateurs.json (logo ou pastille). Sources : SOURCES.md. -->
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(../directions/fonts/Inter_400Regular.ttf); }
@font-face { font-family: Inter; font-weight: 600; src: url(../directions/fonts/Inter_600SemiBold.ttf); }
@font-face { font-family: Jakarta; font-weight: 700; src: url(../directions/fonts/PlusJakartaSans_700Bold.ttf); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #F4F1EA; color: #1F1C17; font: 400 14px/20px Inter, sans-serif; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
h1 { font: 700 22px/28px Jakarta, Inter; margin-bottom: 4px; }
.lede { color: #564E43; margin-bottom: 12px; }
.panel { border-radius: 16px; padding: 4px 12px; margin-bottom: 12px; }
.panel.light { background: #FFFCF7; box-shadow: 0 1px 2px rgba(60,45,20,.08); }
.panel.dark { background: #1D1B17; color: #F3EFE7; }
.panel h2 { font: 700 15px/20px Jakarta, Inter; padding: 10px 0 6px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 56px 44px; align-items: center; column-gap: 8px; min-height: 64px; border-top: 1px solid #EAE3D7; }
.dark .row { border-top-color: #2C2923; }
.name { font: 600 14px/19px Inter; }
.name small { display: block; font: 400 11px/15px Inter; color: #6E6558; }
.dark .name small { color: #A0968A; }
.cell { display: flex; align-items: center; justify-content: center; }
.l48 { width: 48px; height: 48px; border-radius: 12px; display: block; }
.l32 { width: 32px; height: 32px; border-radius: 8px; display: block; }
.pill { display: flex; align-items: center; justify-content: center; font: 700 13px/1 Inter; }
.legend { display: grid; grid-template-columns: minmax(0, 1fr) 56px 44px; column-gap: 8px; font: 600 11px/14px Inter; color: #6E6558; text-align: center; padding-bottom: 4px; }
.dark .legend { color: #A0968A; }
.legend span:first-child { text-align: left; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Logos des opérateurs</h1>
  <p class="lede">Décision et responsabilité du fondateur (21 octobre 2026). Fichiers non modifiés ; coins arrondis à l'affichage seulement. Free Money : pastille en attendant un fichier.</p>
  <div id="root"></div>
</div>
<script>
(async () => {
  const { operateurs } = await (await fetch('../icones/operateurs.json')).json();
  const note = { orange: 'Google Play · Orange SA', mtn: 'Google Play · MTN Group Fintech · macaron « New » d’origine', moov: 'Google Play · Moov Africa CI', wave: 'wave.com · icône de l’application', free: 'pastille (aucun fichier)', airtel: 'Google Play · Airtel Africa · icône « My Airtel »' };
  const mark = (o, px, cls) => (o.affichage === 'logo' && o.logo
    ? `<img class="${cls}" src="../${o.logo}" alt="">`
    : `<span class="pill ${cls}" style="background:${o.pastille.fond};color:${o.pastille.texte};font-size:${px > 40 ? 13 : 10}px">${o.pastille.initiales}</span>`);
  document.getElementById('root').innerHTML = ['light', 'dark'].map((t) => `<div class="panel ${t}"><h2>${t === 'light' ? 'Clair' : 'Sombre'}</h2>
    <div class="legend"><span>Opérateur</span><span>48 dp</span><span>32 dp</span></div>
    ${operateurs.map((o) => `<div class="row"><div class="name">${o.nom}<small>${note[o.id]}</small></div><div class="cell">${mark(o, 48, 'l48')}</div><div class="cell">${mark(o, 32, 'l32')}</div></div>`).join('')}</div>`).join('');
  await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((ok) => { im.onload = im.onerror = ok; }))));
  await document.fonts.ready;
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
